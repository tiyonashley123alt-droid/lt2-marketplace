services:
  - type: web
    name: lt2-marketplace
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: cp lt2.db /data/lt2.db; node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /data/lt2.db
      - key: PORT
        value: 10000
    disk:
      name: lt2-data
      mountPath: /data
      sizeGB: 1
