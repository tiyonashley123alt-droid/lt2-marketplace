<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — LT2 Marketplace</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">
  <div style="width:100%;max-width:380px">
    <div style="text-align:center;margin-bottom:32px">
      <div class="brand" style="justify-content:center;font-size:20px;margin-bottom:8px"><span class="brand-dot"></span>LT2 Marketplace</div>
      <p style="color:var(--text-3);font-size:14px">Admin Dashboard</p>
    </div>
    <div class="admin-card">
      <div class="field" style="margin-bottom:12px"><label>Username</label><input id="u" placeholder="admin"></div>
      <div class="field" style="margin-bottom:20px"><label>Password</label><input id="p" type="password" placeholder="••••••••"></div>
      <button class="btn primary" style="width:100%" onclick="login()">Sign In</button>
      <p id="err" style="color:var(--danger);font-size:13px;margin-top:12px;text-align:center"></p>
    </div>
  </div>
</div>
<script>
async function login(){
  const u=document.getElementById('u').value, p=document.getElementById('p').value;
  const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:u,password:p})});
  const d=await r.json();
  if(!r.ok){ document.getElementById('err').textContent=d.error||'Login failed'; return; }
  localStorage.setItem('adminToken', d.token);
  location.href='admin.html';
}
</script>
</body>
</html>
