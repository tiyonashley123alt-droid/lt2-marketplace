<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success — LT2 Marketplace</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center">
  <div style="max-width:480px">
    <div id="statusIcon" style="font-size:64px;margin-bottom:24px">⏳</div>
    <h1 id="statusTitle" style="font-size:32px;font-weight:700;letter-spacing:-.02em;margin-bottom:12px">Processing Payment...</h1>
    <p id="statusMsg" style="color:var(--text-2);margin-bottom:32px">Please wait while we verify your payment.</p>
    <div style="display:flex;gap:12px;justify-content:center">
      <a href="index.html" class="btn primary">Back to Shop</a>
      <a href="order-status.html" class="btn ghost">Track Order</a>
    </div>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const orderNumber = params.get('order');
const paypalOrderId = params.get('token');

if (orderNumber && paypalOrderId) {
  fetch('/api/verify-payment', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ order_number: orderNumber, paypal_order_id: paypalOrderId })
  })
  .then(r => r.json())
  .then(data => {
    const icon = document.getElementById('statusIcon');
    const title = document.getElementById('statusTitle');
    const msg = document.getElementById('statusMsg');
    if (data.paid) {
      icon.textContent = '✓';
      title.textContent = 'Payment Successful';
      msg.textContent = 'Your order has been confirmed. The seller will deliver your items inside Lumber Tycoon 2.';
    } else {
      icon.textContent = '✗';
      title.textContent = 'Payment Failed';
      msg.textContent = data.error || 'Payment could not be verified. Please try again.';
    }
  })
  .catch(() => {
    document.getElementById('statusIcon').textContent = '✗';
    document.getElementById('statusTitle').textContent = 'Verification Error';
    document.getElementById('statusMsg').textContent = 'Could not verify payment. Please contact support.';
  });
} else if (orderNumber) {
  document.getElementById('statusIcon').textContent = '✓';
  document.getElementById('statusTitle').textContent = 'Order Placed';
  document.getElementById('statusMsg').textContent = 'Your order has been placed. Track it using order number: ' + orderNumber;
} else {
  document.getElementById('statusIcon').textContent = '✓';
  document.getElementById('statusTitle').textContent = 'Payment Successful';
  document.getElementById('statusMsg').textContent = 'Your order has been confirmed. The seller will deliver your items inside Lumber Tycoon 2.';
}
</script>
</body>
</html>
